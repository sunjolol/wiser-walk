<!doctype html>
<!--
  Social preview cards, 1200 x 630. One template, drawn by headless Chrome:
    sh design/tools/shot.sh "file:///.../design/og/card.html?v=sky&h=..." out.png 1200 630
  Params: v (layout), h (headline; use | for a line break, *word* for the warm italic), k (kicker),
          s (small line under the headline), img (path under site/public, or a path relative
          to this file), pos (object-position), tone (photo | engraving | painting | night)
  A result's card adds: m (the "my result" line over the name), u (a line under the name, in
          the warm italic), n (a note that travels with the name, printed small above the foot),
          frame (1 = the picture stands in a frame on the right over a blur of itself, for a
          portrait too small to fill the card)
  Type is large on purpose: a card is usually seen about 400px wide in a feed. Headlines are set
  in Philosopher Bold, the site's display face since 2026-09-22 (the cards drawn before then
  were DM Serif Display); Poppins and Inter do everything small, as on the site.

  The brand is the owner's logo (2026-09-23: he wants his mark on everything he shares): the
  brush W, then the two words, sized as the header sizes them (site.css .brand). The W is his
  larger export (159 x 114), only ever scaled down. The words are wordmark.svg, whose ink is
  currentColor; an image has no current colour, so it draws black and a filter turns it white.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,700;1,700&family=Poppins:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #15161c; }
  body { position: relative; font-family: Inter, sans-serif; color: #fff; }
  .bg, .bg img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bg img { object-fit: cover; }
  .scrim { position: absolute; inset: 0; }
  .in { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  /* The W 56px tall; the words 18.5/34 of that and the gap 15/34 of it, as in the header. */
  .brand { display: flex; align-items: center; gap: 25px; }
  .brand-w { width: 78px; height: 56px; filter: drop-shadow(0 2px 12px rgba(10,16,30,.45)); }
  .brand-word { width: 210px; height: 30.5px; transform: translateY(-1px); filter: brightness(0) invert(1) drop-shadow(0 2px 14px rgba(10,16,30,.6)); }
  .kicker {
    display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; padding: 10px 22px; border-radius: 999px;
    font-family: Poppins, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: .15em; text-transform: uppercase;
    background: rgba(255,255,255,.16); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4); backdrop-filter: blur(8px);
  }
  h1 { font-family: "Philosopher", serif; font-weight: 700; font-size: 92px; line-height: 1.02; letter-spacing: -.02em; text-shadow: 0 3px 26px rgba(10,16,30,.55); }
  h1 em { font-style: italic; color: #FFD2B0; }
  h1, .small { text-wrap: balance; }
  .small { margin-top: 22px; font-size: 34px; font-weight: 500; line-height: 1.35; color: rgba(255,255,255,.95); text-shadow: 0 2px 14px rgba(10,16,30,.6); max-width: 800px; }
  .url { font-family: Poppins, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.95); text-shadow: 0 1px 10px rgba(10,12,18,.85), 0 0 2px rgba(10,12,18,.6); }
  .bar { height: 6px; width: 120px; border-radius: 6px; background: linear-gradient(90deg, #7EBAEE, #F0A06F); }
  .foot { margin-top: auto; padding-top: 26px; display: flex; align-items: center; justify-content: space-between; }

  /* tones */
  .t-photo .scrim { background: radial-gradient(90% 70% at 30% 45%, rgba(14,24,46,.55), transparent 75%), linear-gradient(180deg, rgba(14,24,46,.38), rgba(14,24,46,.05) 45%, rgba(30,18,10,.45)); }
  .t-engraving .bg img { filter: sepia(.34) contrast(.92) brightness(1.04); }
  .t-engraving .scrim { background: linear-gradient(90deg, rgba(30,26,22,.94) 0%, rgba(30,26,22,.82) 42%, rgba(30,26,22,.18) 78%, rgba(30,26,22,.05)); }
  .t-painting .scrim { background: linear-gradient(90deg, rgba(24,20,16,.95) 0%, rgba(24,20,16,.86) 44%, rgba(24,20,16,.12) 74%, rgba(24,20,16,0)); }
  .t-night .bg img { opacity: .7; }
  .t-night .scrim { background: linear-gradient(180deg, rgba(18,17,15,.5), rgba(18,17,15,.78)); }
  .t-dawn .scrim { background: linear-gradient(90deg, rgba(40,22,8,0) 28%, rgba(34,20,10,.72) 70%), linear-gradient(180deg, rgba(28,28,35,0) 40%, rgba(28,28,35,.6)); }

  /* layouts */
  .v-left h1 { margin-top: 34px; max-width: 800px; }
  .v-left.t-engraving .bg img, .v-left.t-painting .bg img { left: 38%; width: 62%; }
  .v-center .in { align-items: center; text-align: center; }
  .v-center .kicker { align-self: center; }
  .v-center h1 { margin-top: 38px; font-size: 104px; }
  .v-center .small { max-width: 860px; }
  .v-center .foot { width: 100%; }
  .v-right .in { align-items: flex-end; text-align: right; }
  .v-right .kicker { align-self: flex-end; }
  .v-right h1 { margin-top: 28px; max-width: 700px; font-size: 86px; }
  .v-right .small { max-width: 640px; }
  .v-right .foot { width: 100%; }

  /* the triptych: three plates side by side under one headline */
  .trip { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
  .trip div { position: relative; overflow: hidden; }
  .trip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: sepia(.34) contrast(.92) brightness(1.02); }
  .trip div + div { box-shadow: -3px 0 0 #15161c; }
  .v-trip .scrim { background: linear-gradient(180deg, rgba(26,22,18,.72) 0%, rgba(26,22,18,.2) 30%, rgba(26,22,18,.9) 72%, rgba(26,22,18,.97)); }
  /* the wordmark keeps the top; the words stand on the dark at the foot */
  .v-trip h1 { font-size: 84px; margin-top: auto; }
  .v-trip .foot { margin-top: 0; }
  .v-trip .small { max-width: 1050px; }

  /* the shelf: headline on the sky, three small rooms on the right */
  .shelf { position: absolute; right: 64px; top: 64px; bottom: 64px; width: 330px; display: grid; grid-template-rows: repeat(3, 1fr); gap: 16px; }
  .shelf div { position: relative; overflow: hidden; border-radius: 24px; box-shadow: 0 12px 30px rgba(10,16,30,.4); }
  .shelf img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shelf div::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,18,16,0) 30%, rgba(20,18,16,.86)); }
  .shelf span { position: absolute; left: 20px; bottom: 14px; z-index: 1; font-family: Poppins, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; }
  .shelf .eng img { filter: sepia(.34) contrast(.92) brightness(1.04); }
  .v-shelf h1 { margin-top: 34px; max-width: 720px; font-size: 88px; }
  .v-shelf .foot { max-width: 700px; }
  .v-shelf .small { max-width: 680px; }

  /* A RESULT's card: the quiz's question as the kicker, then "my result" in small words, the
     name large and whatever belongs under it. The name is the one thing that differs between
     a hundred of these in a feed, so it gets the size. */
  /* The block floats in the middle of the space between the kicker and the foot (or the note). */
  .mine { margin-top: auto; padding-top: 36px; font-size: 32px; font-weight: 500; line-height: 1.3; color: rgba(255,255,255,.93); text-shadow: 0 2px 14px rgba(10,16,30,.6); }
  .mine + h1 { margin-top: 8px; }
  .has-m h1 { font-size: 104px; }
  .under { margin-top: 10px; font-family: "Philosopher", serif; font-weight: 700; font-style: italic; font-size: 40px; line-height: 1.15; color: #FFD2B0; text-shadow: 0 2px 18px rgba(10,16,30,.6); text-wrap: balance; }
  .has-m .small { margin-top: 16px; font-family: Poppins, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: .02em; }
  /* A sentence that travels with the name (the note on Jesus's card, where a book is printed,
     the disagreement over six gifts). Small, but the whole sentence and nothing cut. */
  .note { margin-top: auto; padding-top: 20px; max-width: 700px; font-size: 20px; font-weight: 500; line-height: 1.4; color: rgba(255,255,255,.9); text-shadow: 0 1px 10px rgba(10,12,18,.85); text-wrap: pretty; }
  .note + .foot { margin-top: 0; padding-top: 18px; }
  /* A card with a note gives the name a little less and the words a darker ground to stand on. */
  .has-n h1 { font-size: 92px; }
  .has-n .note { max-width: 660px; }
  .has-n.t-engraving .scrim { background: linear-gradient(90deg, rgba(30,26,22,.95) 0%, rgba(30,26,22,.9) 48%, rgba(30,26,22,.28) 80%, rgba(30,26,22,.08)); }
  .v-left.has-m h1, .v-left .mine, .v-left .under { max-width: 720px; }

  /* A portrait too small to fill the card stands in a frame on the right, over a blur of
     itself, and the words keep to the left of it. */
  .framed .bg img { filter: blur(34px) brightness(.5) saturate(1.1); transform: scale(1.25); }
  .framed .scrim { background: linear-gradient(90deg, rgba(22,18,15,.9) 0%, rgba(22,18,15,.72) 55%, rgba(22,18,15,.35)); }
  .frame { position: absolute; right: 72px; top: 64px; bottom: 64px; width: 380px; border-radius: 24px; overflow: hidden;
    box-shadow: 0 14px 38px rgba(0,0,0,.5), 0 0 0 1.5px rgba(255,255,255,.2); }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .framed .in { right: 452px; padding-right: 48px; }
  .framed .kicker { font-size: 17px; letter-spacing: .12em; padding: 10px 20px; }
  .framed h1, .framed .mine, .framed .under { max-width: none; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || 'left', tone = q.get('tone') || 'photo';
  const IMG = '../../site/public';
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  // A line never breaks inside a hyphenated word ("non-|denominational") or before a slash
  // ("Presbyterian|/ Reformed"): the slash stays with the word before it.
  const keep = l => l.replace(/ \//g, '&nbsp;/').replace(/(\w+(?:-\w+)+)/g, '<span style="white-space:nowrap">$1</span>');
  const head = (q.get('h') || 'Wiser Walk').split('|').map(l => keep(esc(l)).replace(/\*(.+?)\*/g, '<em>$1</em>')).join('<br>');
  const k = q.get('k'), s = q.get('s'), img = q.get('img'), pos = q.get('pos') || '50% 50%';
  const m = q.get('m'), u = q.get('u'), n = q.get('n'), framed = q.get('frame') === '1';
  // A path from the site's public folder, or one relative to this file (a design folder's picture).
  const src = p => (p.startsWith('/') ? IMG + p : p);
  document.body.className = `v-${v} t-${tone}${m ? ' has-m' : ''}${n ? ' has-n' : ''}${framed ? ' framed' : ''}`;
  // A plate printed unusually light (art.ts `lift`) is dimmed by the same factor it is on the site.
  const lift = parseFloat(q.get('lift') || '1');
  if (lift !== 1) document.head.insertAdjacentHTML('beforeend', `<style>.bg img{filter:sepia(.34) contrast(.92) brightness(${(1.04 * lift).toFixed(3)})}</style>`);
  // Long headlines (an article's title, a long name) step down so they never run past four lines.
  const plain = (q.get('h') || '').replace(/[*|]/g, ' ');
  // A result's name starts larger (104px), so it takes one more step on the way down.
  const size = plain.length > 44 ? 64 : plain.length > 34 ? 72 : plain.length > 26 ? 80 : m && plain.length > 18 ? 92 : 0;
  if (size) document.head.insertAdjacentHTML('beforeend', `<style>h1{font-size:${size}px !important}</style>`);
  let bg = '';
  if (v === 'trip') {
    const list = (q.get('imgs') || '').split(',');
    const poss = (q.get('poss') || '').split(',');
    bg = `<div class="trip">${list.map((p, i) => `<div><img src="${IMG}${p}" style="object-position:${poss[i] || '50% 20%'}"></div>`).join('')}</div>`;
  } else if (img) {
    bg = `<div class="bg"><img src="${src(img)}" style="object-position:${pos}"></div>`;
    if (framed) bg += `<div class="frame"><img src="${src(img)}" style="object-position:${pos}"></div>`;
  }
  const shelf = v === 'shelf' ? `<div class="shelf">
      <div class="eng"><img src="${IMG}/img/dore-moses.jpg" style="object-position:50% 16%"><span>Quizzes</span></div>
      <div><img src="${IMG}/img/game-manuscript.jpg" style="object-position:50% 20%"><span>Bible games</span></div>
      <div><img src="${IMG}/img/articles/how-to-become-more-grateful.jpg" style="object-position:50% 40%"><span>Articles</span></div>
    </div>` : '';
  const brand = `<p class="brand"><img class="brand-w" src="${IMG}/img/logo-w-large.png" alt="">` +
    `<img class="brand-word" src="${IMG}/img/wordmark.svg" alt="Wiser Walk"></p>`;
  document.body.innerHTML = `${bg}<div class="scrim"></div>${shelf}
    <div class="in">
      ${k ? `<p class="kicker">${esc(k)}</p>` : brand}
      ${m ? `<p class="mine">${esc(m)}</p>` : ''}
      <h1>${head}</h1>
      ${u ? `<p class="under">${esc(u)}</p>` : ''}
      ${s ? `<p class="small">${esc(s)}</p>` : ''}
      ${n ? `<p class="note">${esc(n)}</p>` : ''}
      <div class="foot">${k ? brand : '<span class="bar"></span>'}<p class="url">wiserwalk.com</p></div>
    </div>`;
</script>
</body>
</html>
